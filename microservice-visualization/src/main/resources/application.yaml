spring:
  profiles:
    active: projects
  application:
    name: microservice-visualization
  datasource:
    url: jdbc:h2:mem:microservice_visualization
    #    url: jdbc:h2:file:./microservice_visualization_db
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

  h2:
    console:
      enabled: true
      path: /h2-console

  output:
    ansi:
      enabled: always

  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        # Stateless HTTP MCP server is unauthenticated by default.
        # Place an appropriate security boundary in front of /mcp in production.
        protocol: STATELESS
        name: microservice-visualization-mcp
        version: 1.0.0
        instructions: "MCP server for exploring microservice architecture: project versions, applications, dependencies, topology connections, and cyclic dependency detection."

logging:
  level:
    ROOT: info

server:
  port: 8080
